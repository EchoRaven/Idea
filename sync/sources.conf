# 文档来源配置
#
# 每行一个来源，用 | 分隔四列：
#   项目名 | ssh主机(取自 ~/.ssh/config) | 远程路径 | 备注
#
# 项目名会成为 Ideas/projects/<项目名>/ 的目录名，建议用英文小写加连字符。
# 同一个项目可以配多行 —— 多台机器上的文档会汇到同一个 _inbox/。
# 远程路径写目录（结尾不用加斜杠），会递归拉取其中的文档类文件。
#
# 会拉取的类型：.md .txt .pdf .docx .tex .ipynb .csv README* 及 docs/ 下全部
# 不会拉取：代码、checkpoint、数据集、日志（避免把几十 G 拽下来）
#
# 示例（把下面几行改成你真实的项目，删掉 # 号）：
#
# virtue-guard | Virtue      | ~/virtue/docs        | 主线，周报+技术方案
# virtue-guard | UIUC-4      | ~/exp/virtue/reports | 同项目的实验报告
# safety-eval  | Safety      | ~/workspace/docs     |
# decoding     | decoding    | ~/proj/decoding/doc  | 学习/研究向


# capsec strain-invariance (this UIUC box) — docs pulled into projects/capsec-strain-invariance/_inbox/
capsec-strain-invariance | UIUC-2 | /data1/common/haibotong/rtg-capsec/docs | 生成器 spec/plan
